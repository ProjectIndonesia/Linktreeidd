  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const rootHtml = document.documentElement;

    function applyTheme(isDark) {
      if (isDark) {
        rootHtml.classList.add('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-sun text-lg text-amber-400 rotate-180';
        localStorage.setItem('nayla_preferred_theme', 'dark');
      } else {
        rootHtml.classList.remove('dark');
        if (themeIcon) themeIcon.className = 'fa-solid fa-moon text-lg text-gray-700 rotate-0';
        localStorage.setItem('nayla_preferred_theme', 'light');
      }
    }

    function initTheme() {
      const stored = localStorage.getItem('nayla_preferred_theme');
      if (stored === 'dark') applyTheme(true);
      else if (stored === 'light') applyTheme(false);
      else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark);
      }
    }

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', function() {
        applyTheme(!rootHtml.classList.contains('dark'));
      });
    }

    initTheme();
  </script>
